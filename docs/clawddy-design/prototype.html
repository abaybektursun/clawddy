<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawddy prototype</title>
<style>
  /* Every surface takes its hue from the terminal theme. A terminal that needs the person is the brightest thing in the window. */
  :root {
    color-scheme: dark;
    --term: #282c34; --term-off: #23262c; --term-fg: #d7dae0; --term-dim: #8b919c; --term-green: #98c379; --term-peach: #d9a66b; --term-blue: #7fb0f5;
    --canvas: #1b1e24; --panel: #21242a; --raised: #292c33; --pop: #2f323a;
    --ink: #e7e9ed; --text2: #a8abb2; --text3: #858890; --text4: #54575e;
    --hair: rgba(255,255,255,.07); --hair2: rgba(255,255,255,.13);
    --signal: #e3b458; --problem: #ef7f86;
    /* Motion: one curve, four durations. Only a screen lighting (which no key causes) is slower. */
    --out: cubic-bezier(.32,.72,0,1); --big: .2s; --zoom: .16s; --small: .15s; --gone: .1s; --light: .4s;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  @property --row { syntax: "<length>"; inherits: false; initial-value: 240px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); overflow: hidden; user-select: none; cursor: default;
    font: 13px/18px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: 44px 1fr; }
  body.still *, body.still *::before, body.still *::after { animation: none !important; transition: none !important; }
  /* Selection and focus never animate: a render that moves them applies its styles with transitions off. */
  body.snap *:not(.grid):not(.gone):not(.said) { transition: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  kbd { font: 11px/16px -apple-system, sans-serif; color: var(--text2); background: rgba(255,255,255,.07); border-radius: 4px; padding: 0 5px; min-width: 18px; display: inline-block; text-align: center; }
  ::selection { background: rgba(231,233,237,.28); }
  /* Hover appears at once and fades over 150 ms when the pointer leaves. */
  :is(.proj, .waiting, .icon, .row, .back, .more, .note, .undo, .help button, .menu button) { transition: background-color var(--small), color var(--small); }
  :is(.proj, .waiting, .icon, .row, .back, .more, .note, .undo, .help button, .menu button):is(:hover, :active) { transition-duration: 0s; }

  /* Top bar: projects, what waits on the person, and the commands used all day. */
  .bar { display: flex; align-items: center; gap: 2px; padding: 0 12px 0 84px; position: relative; }
  .bar.edge { box-shadow: 0 1px 0 var(--hair); }
  .lights { position: absolute; left: 14px; top: 16px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--text4); }
  .proj { padding: 4px 10px; border-radius: 8px; color: var(--text3); display: flex; align-items: baseline; gap: 7px; }
  .proj:hover { color: var(--text2); background: rgba(255,255,255,.04); } .proj:active { background: rgba(255,255,255,.08); }
  .proj.on { color: var(--ink); font-weight: 600; }
  .proj b { font-weight: 500; font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .said { position: absolute; left: 50%; transform: translateX(-50%); color: var(--text2); opacity: 0; pointer-events: none; white-space: nowrap; display: flex; gap: 10px; align-items: center;
    transition: opacity var(--big) var(--out); }
  .said.on { opacity: 1; transition-duration: var(--small); } .said.on:has(button) { pointer-events: auto; }
  .barright { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .waiting { padding: 4px 10px; border-radius: 8px; color: var(--signal); display: flex; gap: 7px; align-items: center; font-variant-numeric: tabular-nums; }
  .waiting::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }
  .waiting.none { color: var(--text3); } .waiting.none::before { background: var(--text4); }
  .waiting:hover, .icon:hover { background: rgba(255,255,255,.05); } .waiting:active, .icon:active { background: rgba(255,255,255,.1); }
  .icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text2); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .undo { color: var(--ink); padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.07); display: flex; gap: 8px; align-items: center; }
  .undo:hover { background: rgba(255,255,255,.1); } .undo:active { background: rgba(255,255,255,.13); }

  /* Home and inside share the stage. While the terminal grows or shrinks both are drawn; only the one the state names takes the pointer. */
  .stage { position: relative; min-height: 0; }
  body[data-mode="home"]:not(.moving) .inside, body[data-mode="inside"]:not(.moving) :is(.grid, .line) { display: none; }
  body[data-mode="home"] .inside, body[data-mode="inside"] :is(.grid, .line) { pointer-events: none; }
  .mark { width: 14px; height: 14px; color: var(--text3); flex: none; }
  .mark svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working > .mark { color: var(--text2); } .working > .mark svg { animation: spin 1.2s linear infinite; } .yours > .mark { color: var(--signal); } .failed > .mark { color: var(--problem); }
  .asks > .mark svg, .failed > .mark svg { fill: currentColor; stroke: none; }

  /* Home: every agent of the project, each in a fixed place. Columns follow the window's width; row height the window's height and the chosen density. */
  .grid { position: absolute; inset: 0 0 62px; overflow: auto; overscroll-behavior: contain; padding: 4px 24px 14px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); grid-auto-rows: var(--row); align-content: start; transition: --row var(--small) var(--out); }
  .grid:has(.empty) { align-content: center; }
  .grid.below { -webkit-mask: linear-gradient(#000 calc(100% - 16px), transparent); mask: linear-gradient(#000 calc(100% - 16px), transparent); }
  .edgepill { position: absolute; left: 50%; transform: translateX(-50%); z-index: 3; display: none; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; background: var(--pop); color: var(--signal); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(227,180,88,.28); }
  .edgepill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
  .edgepill.on { display: flex; }
  .edgepill:hover { background: #363943; } .edgepill:active { background: #3d404b; }
  .edgepill.top { top: 8px; } .edgepill.bot { bottom: 72px; }
  body[data-mode="inside"] .edgepill, body.nothing .edgepill, body.moving .edgepill { display: none; }
  .tile { position: relative; isolation: isolate; overflow: hidden; background: var(--panel); border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); min-width: 0; scroll-margin: 4px 0 14px;
    display: grid; grid-template-columns: 14px 1fr auto; grid-template-rows: auto auto minmax(30px, 1fr); column-gap: 10px; padding: 11px 12px 12px;
    grid-template-areas: "mark title age" "say say say" "tail tail tail"; }
  /* The top line of a question or a problem, following the corner. */
  .tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 2px 0 var(--edge, var(--signal)); opacity: 0; pointer-events: none; transition: opacity var(--big) var(--out); }
  .tile.asks::before, .tile.failed::before { opacity: 1; }
  /* Hover lifts the tile one surface step; pressing lifts it to the raised surface. */
  .tile::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: #fff; opacity: 0; pointer-events: none; transition: opacity var(--small); }
  .tile:hover::after { opacity: .016; transition: none; } .tile:active::after { opacity: .036; transition: none; }
  .tile .mark { grid-area: mark; margin-top: 2px; transition: opacity var(--gone) var(--out); }
  .tile .num { position: absolute; left: 10px; top: 11px; width: 18px; height: 18px; border-radius: 4px; background: var(--pop); box-shadow: inset 0 0 0 1px var(--hair2);
    color: var(--ink); font: 600 11px/18px -apple-system, sans-serif; text-align: center; opacity: 0; pointer-events: none; transition: opacity var(--gone) var(--out); }
  body.nums .tile[data-num]:not(.out) .num { opacity: 1; }
  body.nums .tile[data-num]:not(.out) .mark { opacity: 0; }
  .title { grid-area: title; font-weight: 600; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; outline: none; min-width: 0; }
  .yours > .title { color: var(--ink); }
  .title[contenteditable="true"] { color: var(--ink); background: rgba(255,255,255,.07); box-shadow: 0 0 0 4px rgba(255,255,255,.07); text-overflow: clip; user-select: text; cursor: text; }
  .age { grid-area: age; font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .tile.yours .age { color: var(--text2); }
  .say { grid-area: say; margin-top: 5px; color: var(--text3); display: -webkit-box; -webkit-line-clamp: var(--say, 2); -webkit-box-orient: vertical; overflow: hidden; }
  .tile.finished .say, .tile.paused .say { color: var(--text2); }
  .tile.yours .say { color: var(--ink); -webkit-line-clamp: var(--say4, 4); }
  .say .sent { color: var(--text3); }
  /* The screen. Off while the agent does not need the person, on when it does. Same font and line spacing as the terminal, at 11 px. */
  .tail { grid-area: tail; margin-top: 9px; border-radius: 8px; background: var(--term-off); overflow: hidden; position: relative; font: 11px/17px var(--mono); color: var(--term-fg);
    transition: background-color var(--big) var(--out); }
  .tail-in { position: absolute; inset: 0; overflow: hidden; -webkit-mask: linear-gradient(transparent 0 var(--f1, 6px), #000 var(--f2, 24px)); mask: linear-gradient(transparent 0 var(--f1, 6px), #000 var(--f2, 24px)); }
  .tail.nofade .tail-in { -webkit-mask: none; mask: none; }
  .tail-in div { position: absolute; left: 10px; right: 10px; bottom: 7px; }
  .tail p { margin: 0; min-height: 17px; white-space: pre; overflow: hidden; text-overflow: ellipsis; opacity: .2; transition: opacity var(--big) var(--out); }
  .tile.working .tail p { opacity: .3; }
  .tile.yours .tail { background: var(--term); transition-duration: var(--light); }
  .tile.yours .tail p { opacity: .62; transition-duration: var(--light); } .tile.yours .tail p:nth-last-child(-n+3) { opacity: 1; }
  .tile.sel { background: var(--raised); outline: 1px solid rgba(231,233,237,.30); outline-offset: 2px; }
  body[data-zone="tiles"] .tile.sel.cursor { outline: 1.5px solid rgba(231,233,237,.55); outline-offset: 2px; }
  .tile.sel:not(.yours) .tail p { opacity: .5; }
  .tile.sel.yours { background: var(--panel); }
  body[data-zone="line"].many .tile:not(.sel) { opacity: .55; }
  .tile.lift > :is(.mark, .title, .age, .say, .tail, .num) { visibility: hidden; }
  .tile.lift::before { opacity: 0 !important; transition: none !important; }
  /* A settled place covers its tile in the same rectangle; it fades in over the tile and out again on undo. */
  .gone { position: absolute; inset: 0; z-index: 1; border-radius: inherit; background: var(--canvas); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text3); padding: 14px; opacity: 0; pointer-events: none; transition: opacity var(--small) var(--out); }
  .gone .glab { font-size: 12px; line-height: 16px; color: var(--text3); }
  .gone .gname { font-size: 13px; line-height: 18px; color: var(--text2); font-weight: 500; margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gone .undo { margin-top: 12px; }
  .tile.out .gone { opacity: 1; pointer-events: auto; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--text3); font-size: 15px; }

  /* Inside an agent: its real terminal, with the others listed beside it. Rows keep one height and one order. */
  .inside { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-columns: 252px 1fr; }
  .list { overflow: auto; overscroll-behavior: contain; padding: 0 8px 14px 12px; }
  .back { position: relative; height: 42px; width: 100%; color: var(--text3); padding: 0 8px; border-radius: 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .back::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -3px; height: 1px; background: rgba(255,255,255,.05); pointer-events: none; }
  .back-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .back-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back .chev { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .back:hover { color: var(--text2); } .back:active { background: rgba(255,255,255,.08); }
  .row { display: grid; grid-template-columns: 14px 1fr; column-gap: 10px; padding: 6px 8px 7px; border-radius: 8px; }
  .row:hover { background: rgba(255,255,255,.04); } .row:active { background: rgba(255,255,255,.08); }
  .row .mark { margin-top: 2px; }
  .row .title { grid-area: auto; font-weight: 500; }
  .row.yours .title, .row.current .title { color: var(--ink); font-weight: 600; }
  .row .say { grid-area: auto; grid-column: 2; margin: 0; display: block; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; line-height: 17px; color: var(--text3); }
  .row.current:not(.yours) .say { color: var(--text2); }
  .row.yours .say { color: var(--ink); }
  .row.current { background: var(--raised); }
  .pane { min-width: 0; padding: 0 14px 14px 4px; display: grid; grid-template-rows: 42px 1fr; }
  .pane header { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; min-width: 0; }
  .pane .title { flex: none; max-width: 36vw; color: var(--ink); }
  .pane .say { margin: 0 4px; display: block; white-space: nowrap; text-overflow: ellipsis; color: var(--text2); flex: 1; min-width: 0; }
  @media (max-width: 1011px) { .pane header.hasnews .say { display: none; } }
  .say i { color: var(--text3); } .tile.yours .say i, .row.yours .say i { color: var(--ink); }
  .note { flex: none; max-width: 46%; color: var(--text3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; display: flex; gap: 12px; align-items: center; }
  .note.news { color: var(--ink); background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px var(--news-rim, rgba(227,180,88,.28)); border-radius: 8px; padding: 3px 10px; gap: 8px; }
  .note.news:hover { background: rgba(255,255,255,.10); } .note.news:active { background: rgba(255,255,255,.14); }
  .note.news .mark { color: var(--signal); } .note.news.failed .mark { color: var(--problem); } .note.news span { overflow: hidden; text-overflow: ellipsis; color: var(--text2); } .note.news b { color: var(--ink); font-weight: 500; }
  .scrclip { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: var(--term); }
  .screen { width: 100%; height: 100%; background: var(--term); position: relative; overflow: hidden; transform-origin: 0 0; }
  .snapcover { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; transform-origin: 0 0; }
  .snapcover .tile { width: 100%; height: 100%; outline: none !important; margin: 0; }
  .term { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 22px 12px; font: 13px/20px var(--mono); color: var(--term-fg); white-space: pre-wrap; user-select: text; cursor: text; }
  .term p { margin: 0; min-height: 20px; }
  .term .dim { color: var(--term-dim); } .term .you { background: rgba(255,255,255,.05); margin: 0 -6px; padding: 0 6px; }
  .term .tool::before { content: "⏺ "; color: var(--term-green); } .term .out { color: var(--term-dim); } .term .out::before { content: "  ⎿  "; }
  .term .rep::before { content: "⏺ "; } .term .spin { color: var(--term-peach); } .term .q { color: var(--term-blue); }
  .term .box { margin-top: 10px; border: 1px solid rgba(215,218,224,.3); border-radius: 6px; padding: 5px 10px; min-height: 32px; }
  .term .box::before { content: "> "; color: var(--term-dim); }
  .term .cur { display: inline-block; width: 8px; height: 16px; background: var(--term-fg); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .term .foot { color: var(--term-dim); padding: 3px 2px 0; display: flex; justify-content: space-between; }

  /* The line that starts agents. A raised slab with its controls inside it; it grows upward over the grid's bottom margin. */
  .line { position: fixed; left: 50%; transform: translateX(-50%); width: min(calc(100% - 48px), 960px); bottom: 18px; z-index: 1; background: var(--raised); border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px var(--hair);
    display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 10px; padding: 9px 10px; }
  body[data-zone="line"] .line { box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(231,233,237,.32), 0 4px 24px rgba(0,0,0,.28); }
  .chip { color: var(--text2); font-weight: 500; background: rgba(255,255,255,.06); border-radius: 6px; padding: 3px 9px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .chip.many { color: var(--ink); background: rgba(255,255,255,.12); }
  textarea { color: var(--ink); caret-color: var(--ink); background: none; border: 0; outline: none; user-select: text; cursor: text; transition: height var(--small) var(--out); }
  textarea { font: 14px/22px -apple-system, "SF Pro Text", sans-serif; resize: none; width: 100%; height: 24px; max-height: 134px; padding: 1px 0; }
  textarea::placeholder { color: var(--text3); }
  .ends { display: flex; gap: 12px; color: var(--text3); align-items: center; align-self: end; height: 26px; white-space: nowrap; }
  .more { color: var(--text3); padding: 3px 8px; border-radius: 8px; }
  .more:hover { color: var(--text2); background: rgba(255,255,255,.05); } .more:active { background: rgba(255,255,255,.1); } .more:empty { display: none; }
  .send { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); display: none; place-items: center; transition: transform var(--gone); }
  .send:active { transform: scale(.92); transition-duration: 0s; } .send svg { width: 13px; height: 13px; fill: none; stroke: var(--canvas); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .line.has .send { display: grid; } .line.has .ends .hint, .line.has .more { display: none; }
  .ends .now { display: none; gap: 6px; align-items: center; } .line.has.many .ends .now { display: flex; }

  /* A tile or row picked up to move it: the raised surface, the selection ring and a soft shadow. It is floating, so it may cast one. */
  .tile.lifted, .row.lifted { position: relative; z-index: 4; pointer-events: none; background: var(--raised);
    box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.05); outline: 1px solid rgba(231,233,237,.30); outline-offset: 2px; }
  .tile.lifted.trail { z-index: 3; transition: transform var(--small) var(--out); }
  /* First launch: nothing to show but the way in. */
  .first { grid-column: 1 / -1; width: min(440px, 90%); min-height: 190px; margin: 0 auto; padding: 28px 32px; border: 1px dashed rgba(255,255,255,.09); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text3); font-size: 15px; line-height: 22px; text-align: center; }
  .first button { color: var(--canvas); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; background: var(--ink); display: inline-flex; gap: 8px; align-items: center; transition: background-color var(--small); }
  .first button kbd { background: rgba(27,30,36,.14); color: var(--canvas); font-weight: 500; }
  .first button:hover { background: #fff; transition-duration: 0s; } .first button:active { background: #d5d8de; transition-duration: 0s; }
  .grid:has(.first) { align-content: center; } body.nothing .line, body.nothing #waiting, body.nothing #bfind { display: none; }
  .drop { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; pointer-events: none; border-radius: 10px; box-shadow: inset 0 0 0 2px rgba(231,233,237,.6); }
  .drop.on { display: grid; } .drop span { background: var(--pop); color: var(--ink); padding: 8px 14px; border-radius: 12px; box-shadow: 0 0 0 1px var(--hair2); font-size: 15px; }

  /* Floating things are opaque surfaces with a shadow. */
  .veil { position: absolute; inset: 0; background: rgba(20,22,27,.55); display: none; z-index: 5; }
  .pal { position: absolute; left: 0; right: 0; margin: 0 auto; top: 13%; width: min(640px, 88vw); transform-origin: 50% 0; z-index: 20; display: none; border-radius: 12px; overflow: hidden;
    background: var(--pop);
    box-shadow: 0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(255,255,255,.14); }
  .veil.on, .pal.on, .help.on, .menu.on { display: block; }
  .palrow { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 12px; }
  .pal textarea { flex: 1; font: 17px/24px -apple-system, sans-serif; min-width: 0; height: 24px; max-height: 144px; padding: 0; }
  .pal .list2 { max-height: 46vh; overflow: auto; overscroll-behavior: contain; border-top: 1px solid var(--hair); padding: 6px; }
  .pal h4 { margin: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--text2); }
  .hit { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 7px 12px; border-radius: 8px; color: var(--text2); }
  .hit.on { background: rgba(255,255,255,.08); color: var(--ink); }
  .hit small { display: block; color: var(--text2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hit > span { min-width: 0; } .hit mark { background: none; color: var(--ink); font-weight: 600; } .hit .r { color: var(--text2); font-size: 12px; }
  .pal .plain { padding: 12px 18px 14px; color: var(--text2); display: flex; gap: 18px; }

    else if (mod && code === "KeyA") pin.select();
    else if (mod && code === "Enter") { if (S.pal === "find" && !hits.length && pin.value.trim()) { const t = pin.value; if (S.mode === "inside") { create(t); openPalette("new"); } else { closePalette(); pick(S.cursor); zone("line"); create(t); } } }
    else if (mod) {}
    else if (S.pal === "new") { if (e.key !== "Enter" || e.shiftKey) return; const t = pin.value; pin.value = ""; fit(pin, 144); create(t); }
    else if (e.key === "ArrowDown") { hitAt = Math.min(hits.length - 1, hitAt + 1); search(); }
    else if (e.key === "ArrowUp") { hitAt = Math.max(0, hitAt - 1); search(); }
    else if (e.key === "Enter") runHit(hitAt);
    else return;
    return stop();
  }
  if (mod) {   // the app's own commands; a terminal never sees these
    const d = /^Digit([1-9])$/.exec(code), list = S.mode === "home" ? cells() : living(S.project), brace = code === "BracketRight" ? 1 : code === "BracketLeft" ? -1 : 0, home_ = S.mode === "home";
    if (code === "KeyP") openPalette("find");
    else if (code === "KeyN") newAgent();
    else if (code === "KeyJ") next();
    else if (code === "Escape") home();
    else if (brace && e.shiftKey) show(PROJECTS[(PROJECTS.indexOf(S.project) + brace + PROJECTS.length) % PROJECTS.length]);
    else if (brace) { if (!home_) step(brace); }
    else if (d) { const a = list[d[1] - 1]; if (a && !a.settled) enter(a); }
    else if (code === "KeyZ") { if (home_ && S.zone === "line" && box.value) document.execCommand("undo"); else undo(home_ && S.zone === "line" && !box.value); }
    else if (code === "Enter") { if (home_ && S.zone === "line") submit(true); }
    else if (code === "KeyU") unread();
    else if (code === "KeyD") settle();
    else if (code === "KeyO") addFolder();
    else if (code === "Slash" && e.shiftKey) toggleHelp();
    else if (code === "KeyA") { if (home_ && S.zone === "tiles") { const liv = living(S.project); S.sel = new Set(liv.map(a => a.id)); if (!S.cursor && liv[0]) { S.cursor = liv[0].id; S.anchor = liv[0].id; } render(); } else if (home_) box.select(); }
    else if (code === "Minus" || code === "Equal" || code === "Digit0") { if (home_) density(code === "Minus" ? 1 : code === "Equal" ? -1 : 0); }
    else if (code === "KeyC" && home_ && S.zone === "tiles") copySentence();
    else if (S.zone === "line" && home_) {}   // other chords type nothing into the line
    else return;
    return stop();
  }
  if (S.mode === "inside") {   // every other key belongs to the terminal
    const a = by(S.current); if (!a) return;
    if (e.key === "Enter") { const text = a.input.trim(); if (!text) return stop(); a.input = ""; if (a.state === "working") a.queue.push(text); else startTurn(a, text); }
    else if (e.key === "Backspace") a.input = a.input.slice(0, -1);
    else if (e.key === "Escape" && a.state === "working") { Object.assign(a, { state: "finished", say: "You interrupted it.", app: true, since: now(), queue: [], sent: "" }); a.lines.push(["dim", "  ⎿  Interrupted · What should Claude do instead?"], ["dim", ""]); }
    else if (a.state === "asks" && !a.input && a.options && a.options[e.key - 1]) startTurn(a, a.options[e.key - 1]);
    else if (e.key.length === 1) a.input += e.key; else return;
    stop(); return render();
  }
  if (S.zone === "line") {   // typing; no key here ever moves the selection
    if (e.key === "Enter" && !e.shiftKey) { stop(); submit(false); }
    else if (e.key === "Escape" || (e.key === "ArrowUp" && !box.value.slice(0, box.selectionStart).includes("\n"))) { stop(); if (e.key === "Escape" && S.sel.size > 1 && !box.value) pick(S.cursor); zone("tiles"); render(); }
    else if (e.key === "F2") stop();
    return;
  }
  const cur = by(S.cursor);   // the tiles; no key here ever types into an agent without opening it
  if (e.key.startsWith("Arrow")) { stop(); move(e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0, e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0, e.shiftKey); }
  else if (e.key === "Enter") { stop(); if (S.sel.size > 1) { zone("line"); render(); } else enter(cur); }
  else if (e.key === "Escape") { stop(); if (S.sel.size > 1) { pick(S.cursor); render(); } else if (S.sel.size === 1) { pick(null); render(); } }
  else if (e.key === "F2") { stop(); if (cur) rename(cur); }
  else if (e.key === " ") stop();   // Space does nothing, and never scrolls the grid
  else if (e.key.length === 1 && !e.ctrlKey) {
    if (S.sel.size > 1 || !cur) { zone("line"); render(); }   // several or none selected: the key lands in the line
    else { stop(); enter(cur); if (cur.state !== "asks") cur.input += e.key; render(); }   // one selected: the key goes to its own terminal; a question's menu gets no stray key
  }
});

const helpGroup = (name, items) => "<h4>" + name + "</h4><dl>" + items.map(k => "<dt><kbd>" + k[0] + "</kbd></dt><dd>" + k[1] + "</dd>").join("") + "</dl>";
set($("help"),
  helpGroup("Move", [["← ↑ → ↓", "Move between tiles. Shift selects a range"], ["⌥J", "Walk everyone waiting on you, one press each, then return"], ["⌥⎋", "Back to all agents. Pinching together does the same"], ["⌥1 … 9", "Open the agent in that place. Hold ⌥ to see numbers"], ["⌥[ ⌥]", "Previous and next agent"], ["⇧⌥[ ⇧⌥]", "Previous and next project"], ["⌥P", "Find an agent or run a command"]]) +
  helpGroup("Agents", [["type", "On one selected tile: replies in its terminal. With none: starts a new agent"], ["↩", "On a tile: open its terminal. In the line: start or send"], ["⌥N", "New agent: the line at home, a floating line inside a terminal"], ["⌥D", "Settle. During a walk, settles and moves to the next"], ["⌥Z", "Undo settle or project removal. In an empty line, cancels a start"], ["⌥U", "Mark as unread"], ["F2", "Rename"], ["⌥C", "Copy the selected agents' sentences"], ["⌥O", "Add a project folder"]]) +
  helpGroup("Grid", [["⌥−", "Smaller tiles"], ["⌥+", "Larger tiles"], ["⌥0", "Default tile size"], ["⌃⌥← ⌃⌥→", "Move the selected tile earlier or later. Dragging does the same"]]) +
  '<p>Inside a terminal, every key without ⌥ goes to the terminal. With several tiles selected, typing writes one instruction for all of them.</p><p>A browser keeps ⌘N and ⌘P for itself, so this prototype uses ⌥ where the app uses ⌘, and ⌃⌥ where the app uses ⌥.</p><h4>Try</h4><button id="pfin">Make one working agent finish now</button><button id="prestart">Restart the app</button>');
$("pfin").onclick = () => { const a = A.find(x => x.state === "working" && x.project === S.project && !x.settled && x.id !== S.current) || A.find(x => x.state === "working" && x.id !== S.current); if (a) { finish(a); render(); } };
$("prestart").onclick = restart;

setInterval(() => { if (window.__still) return; for (const a of A) if (a.state === "working" && !a.settled) { if (now() >= a.eta) finish(a); else if (Math.random() < .3) a.lines.push(["out", ["read 3 files", "ran the checks", "12 passed", "wrote the patch", "compared the output"][a.lines.length % 5]]); } render(); }, 1000);

// ---- first paint, and fixed scenes for pictures: prototype.html#inside, #arrival, #find, #new, #mission, #several, #settled, #reply, #typing, #help, #dense, #codex, #menu, #first, #moving ----
pick(null); render(); grow();
const scene = location.hash.slice(1);
if (scene) { window.__still = true; document.body.classList.add("still"); const m = living("paper-kite");
  if (scene === "inside") enter(A[1]);
  if (scene === "arrival") { enter(A[3]); finish(A[1]); render(); }
  if (scene === "find") openPalette("find", "early");
  if (scene === "new") { enter(A[1]); openPalette("new"); $("palin").value = "the sunrise time on the passage screen is a minute off, find out why and fix it"; fit($("palin"), 144); }
  if (scene === "mission") show("paper-kite");
  if (scene === "several") { show("paper-kite"); pick(m[0].id); pick(m[2].id, true); pick(m[3].id, true); box.value = "rebuild from a clean output folder before you continue"; zone("line"); render(); grow(); }
  if (scene === "settled") { pick(A[0].id); settle(); }
  if (scene === "reply") { pick(A[0].id); enter(A[0]); A[0].input = "yes, and add the same test for the tide table"; render(); }
  if (scene === "typing") { box.value = "the sunrise time on the passage screen is a minute off, find out why"; zone("line"); render(); grow(); }
  if (scene === "help") toggleHelp();
  if (scene === "dense") { show("paper-kite"); density(1); density(1); }
  if (scene === "codex") { newAgent("Codex"); box.value = "port the tide chart tests to the new test runner"; grow(); render(); }
  if (scene === "first") { A.forEach(a => a.settled = true); PROJECTS.length = 0; Object.assign(S, { project: null, done: [] }); pick(null); render(); }
  if (scene === "moving") { const t = made.tile.get(A[0].id).getBoundingClientRect(), u = made.tile.get(A[2].id).getBoundingClientRect(); pressStart({ button: 0, clientX: t.left + 60, clientY: t.top + 30, target: made.tile.get(A[0].id) }, made.tile.get(A[0].id), "tile");
    document.dispatchEvent(new MouseEvent("mousemove", { clientX: t.left + 70, clientY: t.top + 40 })); document.dispatchEvent(new MouseEvent("mousemove", { clientX: u.left + 40, clientY: u.top + 50 })); }
  if (scene === "menu") { const r = made.tile.get(A[4].id).getBoundingClientRect(); openMenu(A[4], r.left + 120, r.top + 40); }
}
